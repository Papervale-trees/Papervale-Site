name: Update availability list
on:
  schedule:
    - cron: "0 6 * * 1"   # Every Monday at 06:00 UTC
  workflow_dispatch:       # Adds a "Run workflow" button on the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests openpyxl reportlab pillow
      - name: Fetch stock from Ecwid and build XLSX
        env:
          ECWID_SECRET_TOKEN: ${{ secrets.ECWID_SECRET_TOKEN }}
        run: python scripts/populate-availability.py
      - name: Build PDF
        run: python scripts/generate-availability.py
      - name: Point availability page at this month's files
        run: |
          MONTH=$(date +%B | tr '[:upper:]' '[:lower:]')
          sed -E -i "s#files/availability-list-[a-z]+-2026\.(xlsx|pdf)#files/availability-list-${MONTH}-2026.\1#g" availability.html
      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files/availability-list-*.xlsx files/availability-list-*.pdf availability.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Weekly availability list refresh"
            git push
          fi
